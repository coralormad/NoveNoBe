<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototipo · fondo del hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Manrope:wght@400;600&family=Playfair+Display:wght@700&family=Schibsted+Grotesk:wght@800&display=swap" rel="stylesheet">
  <!-- Tus tokens y estilos reales: el prototipo solo SOBRESCRIBE el fondo -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { padding: 1.5rem 6%; }

    /* ---------- Base común: anula el fondo borroso actual ---------- */
    .hero[data-dir] .concepto-ambiente { filter: none; animation: none; opacity: 1; }

    /* ---------- A · La mirilla ---------- */
    .hero[data-dir="a"] .concepto-ambiente {
      inset: 0;
      -webkit-mask-image: radial-gradient(circle at 72% 50%, #000 0 26%, transparent 27%);
              mask-image: radial-gradient(circle at 72% 50%, #000 0 26%, transparent 27%);
    }
    .hero[data-dir="a"] .concepto-ambiente img:not(:first-child) { display: none; }
    .hero[data-dir="a"] .concepto-ambiente img { scale: 1.15; } /* ojo de pez simulado */
    .hero[data-dir="a"] .concepto-ambiente::after { /* viñeta interior de la lente */
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 72% 50%, transparent 14%, var(--color-fondo) 27%);
    }
    .hero[data-dir="a"] .emblema-svg { display: none; } /* el 9 cede el protagonismo */

    /* ---------- B · Duotono de sala ---------- */
    .hero[data-dir="b"] .concepto-ambiente {
      inset: 0 0 0 40%;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%);
              mask-image: linear-gradient(90deg, transparent, #000 30%);
    }
    .hero[data-dir="b"] .concepto-ambiente img {
      filter: grayscale(1) contrast(1.1);
      transition: filter var(--dur-lenta) var(--curva-cine);
    }
    .hero[data-dir="b"] .concepto-ambiente::after { /* capa lavanda: tiñe sin tocar luces/sombras */
      content: ""; position: absolute; inset: 0;
      background: var(--lavanda-100); mix-blend-mode: color;
      transition: opacity var(--dur-lenta) var(--curva-cine);
    }
    :root[data-theme="claro"] .hero[data-dir="b"] .concepto-ambiente { opacity: 0.55; }
    /* Subir la persiana = ver: vuelve el color a la vez que se abren las lamas */
    .hero[data-dir="b"] .diapositiva--concepto:is(:hover, :focus-within) .concepto-ambiente img { filter: none; }
    .hero[data-dir="b"] .diapositiva--concepto:is(:hover, :focus-within) .concepto-ambiente::after { opacity: 0; }

    /* ---------- C · El proyector ---------- */
    .hero[data-dir="c"] .concepto-ambiente img { display: none; }
    .hero[data-dir="c"] .concepto-ambiente {
      inset: 0;
      background: conic-gradient(from 205deg at 96% -12%,
        transparent 0deg,
        color-mix(in srgb, var(--lavanda-300) 32%, transparent) 10deg,
        color-mix(in srgb, var(--lavanda-300) 10%, transparent) 24deg,
        transparent 30deg);
      filter: blur(6px);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 849px) {
      .hero[data-dir="a"] .concepto-ambiente,
      .hero[data-dir="a"] .concepto-ambiente::after {
        -webkit-mask-image: radial-gradient(circle at 50% 28%, #000 0 30%, transparent 31%);
                mask-image: radial-gradient(circle at 50% 28%, #000 0 30%, transparent 31%);
      }
      .hero[data-dir="b"] .concepto-ambiente {
        inset: 0 0 35% 0; grid-template-columns: repeat(2, 1fr);
        -webkit-mask-image: linear-gradient(0deg, transparent, #000 45%);
                mask-image: linear-gradient(0deg, transparent, #000 45%);
      }
      .hero[data-dir="b"] .concepto-ambiente img:nth-child(3) { display: none; }
    }
    @media (max-width: 599px) {
      .hero[data-dir="b"] .concepto-ambiente { grid-template-columns: 1fr; }
      .hero[data-dir="b"] .concepto-ambiente img:nth-child(n+2) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero[data-dir] .concepto-ambiente::after,
      .hero[data-dir] .concepto-ambiente img { transition: none; }
    }

    /* ---------- Barra del prototipo (no se integra) ---------- */
    .proto-barra {
      position: fixed; inset: auto 1rem 1rem auto; z-index: 10;
      display: flex; gap: 0.5rem; padding: 0.5rem;
      border-radius: 999px; background: var(--color-superficie); border: 1px solid var(--color-borde);
    }
    .proto-barra button {
      min-height: 40px; padding: 0 1rem; border-radius: 999px;
      border: 1px solid var(--color-borde-control); color: var(--color-texto);
    }
    .proto-barra [aria-pressed="true"] { background: var(--color-primario); color: var(--color-sobre-primario); }
  </style>
</head>
<body>
  <section class="hero" data-dir="b" aria-label="Prototipo de fondo">
    <div class="hero-diapositivas">
      <article class="diapositiva diapositiva--concepto">
        <div id="concepto-ambiente" class="concepto-ambiente" aria-hidden="true"></div>
        <div class="diapositiva-texto">
          <p class="sobretitulo">Cine con otra mirada</p>
          <p class="hero-logo">
            <span class="sr-only">NoveNoBé</span>
            <span aria-hidden="true"><b>No</b>ve<b>No</b>Bé</span>
          </p>
          <p class="diapositiva-desc">No hay más ciego que el que no quiere ver. Busca películas, míralas y cuenta lo que no se ve.</p>
          <button type="button" class="diapositiva-boton">Empieza a buscar</button>
        </div>
        <figure class="emblema" aria-hidden="true">
          <svg class="emblema-svg" viewBox="0 0 300 300" focusable="false">
            <defs><clipPath id="clip-nueve"><text class="emblema-nueve" x="150" y="262" text-anchor="middle">9</text></clipPath></defs>
            <g clip-path="url(#clip-nueve)">
              <rect class="emblema-relleno" width="300" height="300"/>
              <g id="emblema-posters"></g>
            </g>
            <g class="emblema-lamas">
              <rect x="20" y="20" width="260" height="16" rx="8"/><rect x="20" y="50" width="260" height="16"/>
              <rect x="20" y="80" width="260" height="16"/><rect x="20" y="110" width="260" height="16"/>
              <rect x="20" y="140" width="260" height="16"/><rect x="20" y="170" width="260" height="16"/>
              <rect x="20" y="200" width="260" height="16"/><rect x="20" y="230" width="260" height="16"/>
              <rect x="20" y="260" width="260" height="16"/>
            </g>
          </svg>
          <figcaption class="emblema-pie">
            <span class="pie-no">No</span><span class="pie-corte">ve</span><span class="pie-no pie-corte">no</span><span class="pie-b">B</span><span class="pie-tilde">é</span>
          </figcaption>
        </figure>
      </article>
    </div>
  </section>

  <div class="proto-barra">
    <button type="button" data-dir="a">A · Mirilla</button>
    <button type="button" data-dir="b" aria-pressed="true">B · Duotono</button>
    <button type="button" data-dir="c">C · Proyector</button>
    <button type="button" data-tema>Tema</button>
  </div>

  <script type="module">
    import { getMovieList } from '../js/api.js';
    import { Movie } from '../js/Movie.js';
    import { fillEmblem } from '../js/hero.js';

    const hero = document.querySelector('.hero');
    const ambiente = document.querySelector('#concepto-ambiente');

    document.querySelector('.proto-barra').addEventListener('click', ({ target }) => {
      const btn = target.closest('button');
      if (!btn) return;
      if (btn.hasAttribute('data-tema')) {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'oscuro' ? 'claro' : 'oscuro';
        return;
      }
      hero.dataset.dir = btn.dataset.dir;
      document.querySelectorAll('[data-dir]:not(.hero)').forEach((b) =>
        b.setAttribute('aria-pressed', String(b === btn)));
    });

    // Mismos datos reales que el hero: estrenos en cines, backdrop grande y nítido
    // Sin await de primer nivel: la barra funciona aunque TMDB tarde
    getMovieList('now_playing').then(({ results }) => {
      const movies = Movie.fromList(results);
      fillEmblem(movies);
      const imgs = movies.filter((m) => m.backdropPath).slice(0, 3).map((m) => {
        const img = new Image();
        img.alt = '';
        img.src = m.backdropUrl;
        return img;
      });
      ambiente.replaceChildren(...imgs);
    }).catch((error) => console.warn('Prototipo sin datos de TMDB', error));

  </script>
</body>
</html>
